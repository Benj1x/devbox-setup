[devbox]
# Fedora-based software engineering dev container for development (desktop/mobile) and current semester courses
image=fedora:40
additional_packages="git curl wget unzip neovim cmake make gcc clang gdb"
additional_packages="python3 python3-pip python3-virtualenv"
additional_packages="nodejs npm dotnet-sdk-8.0 zsh"
volume="/var/mnt/Dev/Github:/workspace"
volume="/var/home/Dev/Android:/android-sdk"
pull=true
root=false
replace=true
start_now=false
init=false
nvidia=false

# Hooks for environment setup (Rust, Flutter, React Native, .NET SDK, Haskell)
# Microsoft VSCode repo (base64-encoded)
init_hooks="echo 'W2NvZGVdCm5hbWU9VmlzdWFsIFN0dWRpbyBDb2RlCmJhc2V1cmw9aHR0cHM6Ly9wYWNrYWdlcy5taWNyb3NvZnQuY29tL3l1bXJlcG9zL3ZzY29kZQplbmFibGVkPTEKZ3BnY2hlY2s9MQpncGdrZXk9aHR0cHM6Ly9wYWNrYWdlcy5taWNyb3NvZnQuY29tL2tleXMvbWljcm9zb2Z0LmFzYw==' | base64 -d | sudo tee /etc/yum.repos.d/vscode.repo"

# Adoptium repo (for OpenJDK)
init_hooks="echo 'W0Fkb3B0aXVtXQpuYW1lPUFkb3B0aXVtCmJhc2V1cmw9aHR0cHM6Ly9wYWNrYWdlcy5hZG9wdGl1bS5uZXQvYXJ0aWZhY3RvcnkvcnBtL2ZlZG9yYS8kcmVsZWFzZXZlci8kYmFzZWFyY2gKZW5hYmxlZD0xCmdwZ2NoZWNrPTEKZ3BnZ2V5PWh0dHBzOi8vcGFja2FnZXMuYWRvcHRpdW0ubmV0L2FydGlmYWN0b3J5L2FwaS9ncGcvS2V5L3B1YmxpYw==' | base64 -d | sudo tee /etc/yum.repos.d/adoptium.repo"
init_hooks="sudo rpm --import https://packages.adoptium.net/artifactory/api/gpg/key/public"

# Install tools (Temurin 17 explicitly); ghc = Glasgow Haskell Compiler. cabal-install = the Haskell build tool and package manager
init_hooks="sudo dnf install -y code dotnet-sdk-8.0 ghc cabal-install temurin-17-jdk"
init_hooks="npm install -g react-native-cli"
init_hooks="git clone https://github.com/flutter/flutter.git -b stable ~/flutter && echo 'export PATH=\$PATH:\$HOME/flutter/bin' >> ~/.bashrc && echo 'export PATH=\$PATH:\$HOME/flutter/bin' >> ~/.zshrc"


# VSCode extensions
init_hooks="code --install-extension haskell.haskell"
init_hooks="code --install-extension justusadam.language-haskell"
init_hooks="code --install-extension ms-dotnettools.csharp"
init_hooks="code --install-extension ms-dotnettools.csdevkit"
init_hooks="code --install-extension ritwickdey.LiveServer"
init_hooks="code --install-extension vscode-icons-team.vscode-icons"
init_hooks="code --install-extension ms-vscode.cpptools"


pre_init_hooks="sudo dnf update -y"
